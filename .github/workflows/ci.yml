name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10 Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IProgram.sln

      - name: Build solution
        run: dotnet build IProgram.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Auth.UnitTests/Auth.UnitTests.csproj --no-build --configuration Release --verbosity normal --filter "Category!=LocalDbRequired"

  frontend:
    name: Frontend (Angular 17 Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

  release-package:
    name: Release Packaging Guard (Combined Artifact Verification)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Authoritative Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Client
        run: npm ci

      - name: Build Production Frontend
        working-directory: Client
        run: npm run build

      - name: Verify Frontend Output in src/Api/wwwroot
        run: |
          echo "Verifying src/Api/wwwroot/index.html exists..."
          test -f src/Api/wwwroot/index.html || { echo "ERROR: src/Api/wwwroot/index.html does not exist!"; exit 1; }

          echo "Verifying JS bundles exist in src/Api/wwwroot..."
          ls src/Api/wwwroot/*.js 1> /dev/null 2>&1 || { echo "ERROR: No JS bundles found in src/Api/wwwroot!"; exit 1; }

          echo "Verifying CSS bundles exist in src/Api/wwwroot..."
          ls src/Api/wwwroot/*.css 1> /dev/null 2>&1 || { echo "ERROR: No CSS bundles found in src/Api/wwwroot!"; exit 1; }

          echo "Verifying src/Api/wwwroot/browser/index.html does NOT exist..."
          if [ -f src/Api/wwwroot/browser/index.html ]; then
            echo "ERROR: Legacy browser/ subfolder detected! Expected direct output in src/Api/wwwroot."
            exit 1
          fi
          echo "Frontend packaging structure verified successfully."

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Backend API with Embedded Frontend
        run: dotnet publish src/Api/Auth.Api.csproj -c Release -o publish/api

      - name: Verify Published Combined Artifact
        run: |
          echo "Verifying publish/api/wwwroot/index.html exists..."
          test -f publish/api/wwwroot/index.html || { echo "ERROR: publish/api/wwwroot/index.html does not exist!"; exit 1; }

          echo "Verifying JS bundles exist in publish/api/wwwroot..."
          ls publish/api/wwwroot/*.js 1> /dev/null 2>&1 || { echo "ERROR: No JS bundles found in publish/api/wwwroot!"; exit 1; }

          echo "Verifying CSS bundles exist in publish/api/wwwroot..."
          ls publish/api/wwwroot/*.css 1> /dev/null 2>&1 || { echo "ERROR: No CSS bundles found in publish/api/wwwroot!"; exit 1; }

          echo "Combined release packaging verified successfully."
